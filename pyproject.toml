[project]
name = "saveix"
dynamic = ["version"]
description = "Automatic, versioned backups of local game save files on Windows."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.13.5",
    "psutil>=7.2.2",
    "tomli-w>=1.2.0",
    "typer>=0.12",
    "watchdog>=6.0.0",
    "zstandard>=0.25.0",
]

[project.scripts]
saveix = "saveix.cli:app"

[project.entry-points."saveix.providers"]
ludusavi = "saveix.integrations.ludusavi:create"

[project.optional-dependencies]
ludusavi = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/saveix/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
